
name: Release Watcher

on:
  push:
    branches:
      - main

  schedule:
    - cron: '0 9 * * 1'

  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Print Event Name
        run: |
          echo "Event: ${{ github.event_name }}"

      - name: Print Current Date and Time
        run: date

      - name: Finish Release Watch
        run: echo "Release watch complete"

